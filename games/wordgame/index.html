<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Game</title>

    <!-- PWA. The placeholders are substituted by the shared plugin
         (@game-host/pwa) — the base to a bare "/", which Vite then prefixes
         exactly once, and the theme color from appColors.ts, the same value
         the manifest generator reads. (The static written-out paths this
         replaces existed because Vite's *built-in* HTML env replacement
         resolves the base without a trailing slash and substitutes inside
         comments; the plugin has neither problem.) -->
    <link rel="manifest" href="__PWA_BASE__manifest.webmanifest" />
    <meta name="theme-color" content="__THEME_COLOR__" />
    <link rel="icon" href="__PWA_BASE__icons/icon-192.svg" type="image/svg+xml" />
    <!-- iOS installs read these, not the manifest — and iOS ignores SVG for
         home-screen icons, so this one is a real PNG (rendered from the SVG
         by @game-host/pwa's rasterizeIcon.mjs; rerun it when the art
         changes). The installed app is exactly where push lives on iOS. -->
    <link rel="apple-touch-icon" href="__PWA_BASE__icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Word Game" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
