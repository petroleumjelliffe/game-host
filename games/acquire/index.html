<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acquire — Multiplayer Board Game</title>

    <!-- PWA. The manifest is generated at build time from src/game/tokens.ts
         (scripts/generate-manifest.ts) — the theme-color below is the same
         token; if it ever disagrees with the manifest, the generator is right.
         __PWA_BASE__ is substituted by the same plugin, slash-normalized. -->
    <link rel="manifest" href="__PWA_BASE__manifest.webmanifest" />
    <!-- __THEME_COLOR__ is substituted by vite.config.ts from APP_COLORS —
         the same token the manifest generator reads, so the two cannot
         disagree and neither is typed by hand. -->
    <meta name="theme-color" content="__THEME_COLOR__" />
    <link rel="icon" href="__PWA_BASE__icons/icon-192.png" type="image/png" />
    <!-- iOS installs read these, not the manifest. -->
    <link rel="apple-touch-icon" href="__PWA_BASE__icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Acquire" />

    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
