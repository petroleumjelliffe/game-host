name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # No `submodules: recursive` — the lobby is a workspace package now,
      # which is the point of the change that removed it.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Builds before it tests, and that is not an optimisation.
      #
      # This workflow ran `npm run typecheck` then `npm test` and was red on
      # `main` for a full day in August 2026, every commit, on one test:
      # apps/host's SPA-fallback check. Rail Baron and Acquire arm their
      # fallback only when a built client sits beside them, so on a runner
      # that had never built, the route 404s. It reported `expected 404 to be
      # 200`, which names neither the cause nor the fix, and it passed for
      # everyone locally because a working tree has been built at least once.
      #
      # No separate typecheck step: `npm run build` runs `npm run typecheck`
      # first and stops on it, so a type error still fails here — it just
      # fails without paying 9s of tsc twice. That gate is why a type error
      # cannot reach either deployment; see README's Deploying.
      - run: npm run build
      - run: npm test

  # A job of its own rather than a fourth step above, for the same reason
  # scripts/test-all.mjs refuses to `&&` its packages together: steps stop at
  # the first failure, so a lint error would hide whatever the build and the
  # 1658 tests were about to say. Two independent answers beat one that
  # short-circuits. It costs a second npm ci, which is cached.
  #
  # Not in `npm run build`, and so not in deploy.sh either: a type error must
  # fail a deploy and does, but a lint error belongs to the pull request. The
  # restart budget the compile plan bought is not spent on style.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # No build first: unlike the tests, lint needs types, not artifacts.
      - run: npm run lint
